name: Satchy Edge QA

on:
  push:
    branches:
      - feat/satchy-agent-context-missions
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff
        run: python -m ruff check src tests

      - name: Tests
        run: python -m pytest -q
