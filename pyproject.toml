[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "terrasatch-edge"
version = "0.2.1"
description = "TerraSatch Edge: local hardware discovery, pairing, device health, diagnostics, and API bridge for field devices."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TerraSatch" }]
dependencies = [
    "httpx>=0.27,<1",
    "psutil>=6.0,<8",
    "pydantic>=2.9,<3",
    "rich>=13.8,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
usb = ["pyusb>=1.2,<2"]
ui = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
build = ["pyinstaller>=6.11,<7"]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
terrasatch-edge = "terrasatch_edge.cli:app"
tsedge = "terrasatch_edge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/terrasatch_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
