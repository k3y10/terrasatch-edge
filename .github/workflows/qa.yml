name: QA

on:
  pull_request:
  push:
    branches:
      - agent/edge-speech-0.2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        shell: bash
        run: |
          mkdir -p qa-logs
          set +e
          ruff check src tests 2>&1 | tee qa-logs/ruff.log
          echo "${PIPESTATUS[0]}" > qa-logs/ruff.status
          exit 0

      - name: Tests
        shell: bash
        run: |
          set +e
          pytest --cov=terrasatch_edge --cov-report=term-missing 2>&1 | tee qa-logs/pytest.log
          echo "${PIPESTATUS[0]}" > qa-logs/pytest.status
          exit 0

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: qa-logs
          retention-days: 3

      - name: Enforce QA result
        shell: bash
        run: |
          ruff_status="$(cat qa-logs/ruff.status)"
          pytest_status="$(cat qa-logs/pytest.status)"
          echo "ruff=$ruff_status pytest=$pytest_status"
          if [ "$ruff_status" != "0" ] || [ "$pytest_status" != "0" ]; then
            exit 1
          fi
