name: Public Edge Release (manual Linux only)

# Deliberately manual-only. Windows Store packages are built/validated locally and
# submitted through Partner Center; development-signed MSIX files are never public releases.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  linux-amd64-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve Edge version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux AMD64 package
        run: ./scripts/build-linux-deb.sh

      - name: Attest Linux build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/terrasatch-edge_${{ steps.version.outputs.version }}_amd64.deb

      - name: Build checksum manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum "terrasatch-edge_${VERSION}_amd64.deb" > SHA256SUMS.txt)

      - name: Publish immutable Linux prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          LINUX="release/terrasatch-edge_${VERSION}_amd64.deb"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to overwrite immutable release assets." >&2
            exit 1
          fi

          NOTES="$(cat <<EOF
          TerraSatch Edge $TAG prerelease.

          Direct artifact:
          - Debian/Ubuntu AMD64: terrasatch-edge_${VERSION}_amd64.deb
          - SHA-256 manifest: SHA256SUMS.txt

          Windows distribution:
          - Microsoft Store MSIX is a separate Store-certified lane.
          - No development certificate or development-signed MSIX is published here.
          - Build Windows release candidates locally with scripts/qa-windows-msix-local.ps1.
          - Build the Partner Center submission package locally with build-windows-msix.ps1 -StoreUpload after applying the exact reserved Store identity.

          Source commit: ${GITHUB_SHA}
          EOF
          )"

          gh release create "$TAG" \
            "$LINUX" \
            release/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "TerraSatch Edge $TAG beta" \
            --notes "$NOTES" \
            --prerelease
