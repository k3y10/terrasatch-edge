name: QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    name: runner-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify built-in runner tools
        shell: bash
        run: |
          set -euo pipefail
          git --version
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, found {sys.version}")
          PY

  clone:
    name: clone-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone feature branch with built-in token
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone \
            --depth 1 \
            --branch "$branch" \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git rev-parse --short HEAD
