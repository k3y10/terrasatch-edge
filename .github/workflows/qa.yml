name: QA

on:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: full-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone branch without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone \
            --depth 1 \
            --branch "$branch" \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git rev-parse --short HEAD

      - name: Verify Python
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, found {sys.version}")
          PY

      - name: Install QA environment
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -c "import terrasatch_edge; print(terrasatch_edge.__version__)"

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          . .venv/bin/activate
          ruff check src tests

      - name: Full pytest and coverage
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          . .venv/bin/activate
          pytest --cov=terrasatch_edge --cov-report=term-missing
