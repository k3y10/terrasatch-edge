name: Windows MSIX QA (manual only)

# Deliberately manual-only. Release-candidate QA is run locally first so opening or
# updating a pull request never consumes GitHub Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve Edge version
        id: version
        shell: powershell
        run: |
          $version = py -3.12 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          "version=$($version.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create temporary MSIX development certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=TerraSatch Inc." `
            -FriendlyName "TerraSatch Edge MSIX CI Development" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddDays(7)

          New-Item -ItemType Directory -Force release | Out-Null
          Export-Certificate `
            -Cert $cert `
            -FilePath "release\TerraSatch-MSIX-Dev.cer" | Out-Null
          Import-Certificate `
            -FilePath "release\TerraSatch-MSIX-Dev.cer" `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" | Out-Null
          "TERRASATCH_MSIX_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stage RTL-SDR runtime
        shell: powershell
        run: ./scripts/stage-rtlsdr-windows.ps1

      - name: Build development-signed MSIX
        shell: powershell
        run: ./scripts/build-windows-msix.ps1

      - name: Validate Store-friendly MSIX manifest
        shell: powershell
        run: |
          [xml]$manifest = Get-Content "release\msix-verify\AppxManifest.xml"
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("f", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $ns.AddNamespace("desktop", "http://schemas.microsoft.com/appx/manifest/desktop/windows10")
          $ns.AddNamespace("rescap", "http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities")

          $identity = $manifest.SelectSingleNode("/f:Package/f:Identity", $ns)
          if ($identity.Name -ne "TerraSatch.Edge.Dev") { throw "Unexpected MSIX identity: $($identity.Name)" }
          if ($identity.Publisher -ne "CN=TerraSatch Inc.") { throw "Unexpected MSIX publisher: $($identity.Publisher)" }

          $serviceExtensions = $manifest.SelectNodes("//desktop:Extension[@Category='windows.service']", $ns)
          if ($serviceExtensions.Count -ne 0) { throw "Store MSIX must not declare packaged Windows services." }

          $startup = $manifest.SelectNodes("//desktop:Extension[@Category='windows.startupTask']/desktop:StartupTask", $ns)
          if ($startup.Count -ne 2) { throw "Expected 2 startup tasks, found $($startup.Count)." }
          $edgeTask = @($startup | Where-Object { $_.TaskId -eq "TerraSatchEdgeAgent" })
          $radioTask = @($startup | Where-Object { $_.TaskId -eq "TerraSatchRadio" })
          if ($edgeTask.Count -ne 1 -or $edgeTask[0].Enabled -ne "true") { throw "TerraSatch Edge startup task must be enabled." }
          if ($radioTask.Count -ne 1 -or $radioTask[0].Enabled -ne "false") { throw "TerraSatch Radio startup task must default disabled." }

          $capabilities = @($manifest.SelectNodes("//rescap:Capability", $ns) | ForEach-Object { $_.Name })
          if ("runFullTrust" -notin $capabilities) { throw "runFullTrust capability missing." }
          if ("packagedServices" -in $capabilities) { throw "packagedServices must not be present in Store MSIX." }
          if ("localSystemServices" -in $capabilities) { throw "localSystemServices must not be present in Store MSIX." }

      - name: Verify MSIX signature
        shell: powershell
        run: |
          $signTool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          & $signTool.FullName verify /pa /v "release\TerraSatch-Edge_${{ steps.version.outputs.version }}_x64.msix"
          if ($LASTEXITCODE -ne 0) { throw "MSIX signature verification failed." }

      - name: Upload MSIX test artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrasatch-edge-msix-dev
          path: |
            release/TerraSatch-Edge_${{ steps.version.outputs.version }}_x64.msix
            release/TerraSatch-MSIX-Dev.cer
          if-no-files-found: error
          retention-days: 7
