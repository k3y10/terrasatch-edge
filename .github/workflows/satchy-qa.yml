name: Satchy Edge QA (manual only)

# Deliberately manual-only. TerraSatch Edge release-candidate validation is run
# locally first so pushes and pull requests never consume GitHub Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,ui]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Ruff
        run: python -m ruff check src tests

      - name: Tests
        run: python -m pytest -q
